<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>konduct.com.au</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --bg: #000; --fg: #00ff6a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
    body {
      min-height: 100vh; display: grid; place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px; letter-spacing: 0.04em; line-height: 1.7; text-transform: uppercase;
    }
    main { max-width: 42rem; padding: 2rem; }
    p { margin: 0 0 0.85em; }
    a { color: var(--fg); }
    .cursor {
      display: inline-block; width: 0.6em; border-bottom: 2px solid var(--fg);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { border-color: transparent; } }
  </style>
</head>
<body>
  <main>
    <p>&gt; konduct.com.au</p>
    <p>&gt; this address is no longer in use.</p>
    <p>&gt; the site that lived here has been retired.</p>
    <p>&gt; konduct continues at <a href="https://konduct.au">konduct.au</a></p>
    <p>&gt; mail to this domain still reaches the house.</p>
    <p>&gt; contact <a href="mailto:info@konduct.au">info@konduct.au</a> for anything urgent.</p>
    <p>&gt; <span class="cursor"></span></p>
  </main>
</body>
</html>
